<!--
  GAM Creative Template — Interstitial Standard (320×480 inventory).
  Edge-to-edge SafeFrame/MRAID fill. Type unit = 1% of min(width, height/1.5)
  so tall 640×1280 slots do not inflate team names. Legal band is in-flow
  (not absolute) so the CTA cannot sit underneath it.
  Legal footer is outside the click <a> (nested anchors break GAM preview).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="[[runtime_url]]" defer></script>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  .ad-shell {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-size: 1vw; /* boot script overrides from shell size */
  }
  .ad {
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
    overflow: hidden;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    padding: 0 2.5% 5%;
    display: flex; flex-direction: column;
    text-decoration: none;
  }
  .ad-shell.legal-band .ad {
    flex: 1 1 0;
    min-height: 0;
    max-height: calc(100% - var(--dba-legal-h, 72px));
    padding-bottom: 0.5%;
  }
  .ad-shell.legal-band .ad .logo-wrap { margin-bottom: 0; }

  .ad .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    margin-top: 10px; margin-bottom: 0;
    flex: 0 0 auto;
    overflow: visible;
    min-height: 0;
  }
  /* Height-driven, not a forced square: real bookmaker logos are usually wide
     wordmarks (see design ref), and a fixed 1:1 box wasted vertical space that
     belonged to the match cards below. background-size:contain still keeps
     square/circular badge logos correctly proportioned inside this box. */
  .ad .logo {
    width: 62%;
    height: 9em;
    min-height: 26px;
    max-height: 64px;
    flex-shrink: 0;
    overflow: visible;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center center;
    border-radius: 2em;
  }
  .ad .matches {
    flex: 1 1 0;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    min-height: 0;
    width: 100%;
    margin: 0;
  }
  .ad .cta-zone {
    flex: 0 0 auto;
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
    min-height: 0;
    margin-top: 0;
    padding-top: 0;
    padding-bottom: 1%;
    position: relative;
    z-index: 2;
    background: inherit; /* cover any bleed from matches */
  }
  .ad .dba-dots[data-layout="interstitial"] {
    height: 2.8em; min-height: 10px; max-height: 4%;
    margin: 0.6% 0;
    display: flex; justify-content: center; align-items: center;
    gap: 0.8em; flex: 0 0 auto; pointer-events: none; color: inherit;
  }
  .ad .dba-dots[data-layout="interstitial"] .dba-dot {
    display: inline-block; border-radius: 999px; background: currentColor;
    height: 0.8em; width: 0.8em; min-height: 4px; min-width: 4px; opacity: 0.35;
  }
  .ad .dba-dots[data-layout="interstitial"] .dba-dot-active {
    width: 1.6em; min-width: 8px; opacity: 1;
  }
  .ad .cta-zone > .dba-dots[data-layout="interstitial"] + .cta { margin-top: 0; }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none;
    width: 95%;
    height: auto;
    min-height: 44px;
    padding: 3.4% 0;
    margin-top: 0;
    position: relative;
    border-radius: 1.2em;
    font-size: 4.6em;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px 0 rgba(0, 32, 27, 0.69);
    flex: 0 0 auto;
    box-sizing: border-box;
  }

  .ad-shell .legal { pointer-events: none; z-index: 3; flex-shrink: 0; }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    flex: 0 0 auto;
    position: relative;
    margin: 0 1% 0.5%;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2.2em; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 0.35em; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.2em; height: 1.2em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.85em; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Brazil SPA/MF: legal band must occupy 10% of total ad height. */
  .ad-shell .legal.legal-band {
    flex: 0 0 10%;
    flex-shrink: 0;
    min-height: 10%;
    height: 10%;
    position: relative;
    width: 100%;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 0.4em;
    box-sizing: border-box;
    padding: 0.6em 0.8em;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: var(--dba-legal-font, 2.2em); font-weight: 600; line-height: 1.15;
    text-align: left;
    overflow: hidden;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4em; height: 1.4em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.9em; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
      <div class="logo-wrap">
        <div class="logo" aria-label="[[bookmaker_name]]"></div>
      </div>
      <div class="matches"
           data-feed="[[feed_url]]"
           data-layout="interstitial"
           data-per-slide="3"
           data-interval="3500"
           data-transition="700"
           data-pill-bg="[[date_pill_bg]]"
           data-pill-fg="[[date_pill_text_color]]"></div>
      <div class="cta-zone">
        <span class="cta">[[cta_text]]</span>
      </div>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
  <script>
  (function () {
    // 1em = 1% of the limiting dimension (width vs height/1.5) so tall
    // full-screen slots do not oversize type relative to card height.
    function apply() {
      var shell = document.querySelector('.ad-shell');
      if (!shell) return;
      var w = shell.clientWidth || document.documentElement.clientWidth || 320;
      var h = shell.clientHeight || document.documentElement.clientHeight || Math.round(w * 1.5);
      if (w < 1) w = 320;
      if (h < 1) h = Math.round(w * 1.5);
      var unit = Math.min(w, h / 1.5) * 0.01;
      if (document.querySelector('.matches[data-layout="interstitial"]')) unit = w * 0.01;
      var next = unit + 'px';
      if (shell.style.fontSize !== next) shell.style.fontSize = next;
      var legal = shell.querySelector('.legal');
      if (legal && shell.classList.contains('legal-band')) {
        var lh = legal.offsetHeight;
        if (lh < 1) lh = Math.round(h * 0.09);
        shell.style.setProperty('--dba-legal-h', lh + 'px');
      }
      /* Legacy gap cap — runtime re-measures .matches and may shrink further. */
      var cardGap = Math.round(h * 0.045) + 'px';
      var tightGap = Math.round(h * 0.034) + 'px';
      shell.style.setProperty('--dba-card-gap', cardGap);
      shell.style.setProperty('--dba-card-gap-tight', tightGap);
    }
    function boot() {
      apply();
      requestAnimationFrame(function () {
        apply();
        if (window.DbaApplyShellMetrics) window.DbaApplyShellMetrics();
      });
      window.addEventListener('resize', apply);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
