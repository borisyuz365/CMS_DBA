<!--
  GAM Creative Template — Banner (320×50).
  Legal footer is outside the click <a> (nested anchors break GAM preview).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="[[runtime_url]]" defer></script>
<style>
  html, body { margin: 0; padding: 0; }
  .ad-shell {
    width: 320px; height: 50px;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
  }
  .ad {
    width: 100%; height: 100%;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    padding: 0 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: stretch;
    column-gap: 8px;
    text-decoration: none;
  }
  .ad-shell.legal-band .ad { padding: 0 6px; column-gap: 5px; }
  .ad-shell.legal-band .ad .logo { width: 52px; height: 52px; }
  .ad-shell.legal-band .ad .logo-wrap,
  .ad-shell.legal-band .ad .matches,
  .ad-shell.legal-band .ad .cta-wrap {
    padding-bottom: 18px;
    transform: translateY(-4px);
  }
  .ad .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .ad .logo {
    width: 48px; height: 48px;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center;
    flex-shrink: 0;
  }
  .ad .matches {
    position: relative;
    overflow: hidden;
    min-width: 0;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .ad .cta-wrap {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none; height: 30px; padding: 0 8px;
    position: relative;
    border-radius: 4px;
    font-size: 10px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 0.01em;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ad-shell.legal-band .ad .cta { height: 20px; padding: 0 6px; font-size: 8px; }

  .ad-shell .legal { pointer-events: none; z-index: 10; }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    position: absolute; left: 4px; right: 4px; bottom: 1px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 6px; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 2px; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 11px; height: 11px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 6px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ad-shell .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 12px;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 4px;
    box-sizing: border-box;
    padding: 1px 4px;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 4.5px; font-weight: 700; line-height: 1.15;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 9px; height: 9px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 4.4px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
      <div class="logo-wrap">
        <div class="logo" aria-label="[[bookmaker_name]]"></div>
      </div>
      <div class="matches"
           data-feed="[[feed_url]]"
           data-layout="banner"
           data-per-slide="1"
           data-interval="3500"
           data-transition="700"></div>
      <div class="cta-wrap">
        <span class="cta">[[cta_text]]</span>
      </div>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
</body>
</html>
