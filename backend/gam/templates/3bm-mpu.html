<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DBA 3-Bookie Fluid MPU</title>
    <style>
        .mpu-rigid-split { width: 100%; height: 250px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 8px; }
        .mpu-section { height: 83.33px; max-height: 83.33px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 12px 8px 12px; text-decoration: none; box-sizing: border-box; overflow: hidden; cursor: pointer; }
        .mpu-section:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card-top-line { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; max-height: 24px; overflow: hidden; flex-shrink: 0; }
        .param-logo-img { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: auto; max-width: 75px; object-fit: contain; flex-shrink: 0; display: block; }
        .param-headline { width: 100%; text-align: center; padding: 0 75px; white-space: normal; word-break: break-word; overflow: hidden; line-height: 1.1; }
        .param-conditions { width: 100%; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; margin-top: 1px; margin-bottom: 2px; flex-shrink: 0; }
        .param-cta-btn { width: 100%; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; text-transform: uppercase; box-sizing: border-box; transition: transform 0.2s, filter 0.2s; flex-shrink: 0; }
        .mpu-section:hover .param-cta-btn { filter: brightness(1.1); transform: translateY(-0.5px); }
    </style>
</head>
<body>
    <div style="display: none !important; visibility: hidden;"><p>[%Bypass%]</p></div>

    <div class="three-bm-mpu mpu-rigid-split" [[root_attrs]]>
[[sections_html]]
    </div>
    <script src="[[runtime_url]]" defer></script>
</body>
</html>
