<!--
  GAM Creative Template — Interstitial Welcome Offer (320×480 fluid, AdOps 2∶3).
  Shell fills SafeFrame width; height = width × 1.5. Layout uses em tied to shell width.
  Legal footer is outside the click <a> (nested anchors break GAM preview).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  .ad-shell {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
    font-size: 5vw;
  }
  .ad {
    width: 100%; height: 100%;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    padding: 1em 0.9em 2.5em;
    display: flex; flex-direction: column;
    text-decoration: none;
  }
  .ad-shell.legal-band .ad {
    padding: 1em 0.9em 3.2em;
  }
  .ad-shell.legal-band .ad .copy { flex: 0 0 auto; }
  /* Welcome interstitial: CTA stays in normal flow (never MPU absolute bottom). */
  .ad-shell.legal-band .ad .cta-zone {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .ad-shell.legal-band .ad .cta-zone .cta,
  .ad-shell.legal-band .ad .cta {
    position: relative;
    left: auto; right: auto; bottom: auto;
    margin-top: 0;
  }
  .ad-shell.legal-band .ad .terms { margin-top: 0.5em; }

  .ad .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    margin-top: 0.6em; margin-bottom: 0.4em;
    flex-shrink: 0;
  }
  .ad .logo {
    width: 22.5%;
    aspect-ratio: 1;
    height: auto;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center;
    border-radius: 0.75em;
  }
  .ad .pill-wrap {
    display: flex; justify-content: center; margin-bottom: 0.6em;
    flex-shrink: 0;
  }
  .ad .pill {
    padding: 0.3em 0.7em; border-radius: 999px;
    background: #FFC107; color: #0A0A0A;
    font-size: 0.65em; font-weight: 800;
    letter-spacing: 0.08em; text-indent: 0.08em;
    text-transform: uppercase; text-align: center;
  }
  .ad .copy {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; gap: 0.6em;
    text-align: center; min-height: 0;
  }
  .ad .copy .head {
    font-size: 2.2em; font-weight: 800;
    line-height: 0.98; letter-spacing: -0.03em;
  }
  .ad .copy .sub {
    font-size: 0.85em; opacity: 0.85;
    line-height: 1.25; font-weight: 500;
  }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none;
    height: 2.75em;
    margin-top: 0.75em;
    position: relative;
    border-radius: 0.75em;
    font-size: 1em;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center;
  }
  /* Page indicator — mounted on .ad-shell (outside click <a>) by dba-runtime.js */
  .ad-shell > .dba-dots-shell[data-layout="interstitial"] {
    position: absolute; left: 0; right: 0; bottom: 2.2em;
    height: 0.75em; display: flex; justify-content: center; align-items: center;
    gap: 0.35em; z-index: 5; pointer-events: none; color: inherit;
  }
  .ad-shell > .dba-dots-shell[data-layout="interstitial"] .dba-dot {
    display: inline-block; border-radius: 999px; background: currentColor;
    height: 0.35em; width: 0.35em; opacity: 0.35;
  }
  .ad-shell > .dba-dots-shell[data-layout="interstitial"] .dba-dot-active {
    width: 0.75em; opacity: 1;
  }
  .ad-shell.legal-band > .dba-dots-shell[data-layout="interstitial"] { bottom: 11%; }
  .ad .terms {
    margin-top: 0.5em;
    font-size: 0.5em; opacity: 0.55;
    text-align: center; line-height: 1.3;
  }

  .ad-shell .legal { pointer-events: none; z-index: 10; }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    position: absolute; left: 0.9em; right: 0.9em; bottom: 0.5em;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.5em; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 0.35em; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.2em; height: 1.2em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.85em; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ad-shell .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 2.5em;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 0.4em;
    box-sizing: border-box;
    padding: 0.25em 0.6em;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 0.55em; font-weight: 700; line-height: 1.2;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4em; height: 1.4em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.9em; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
      <div class="logo-wrap">
        <div class="logo" aria-label="[[bookmaker_name]]"></div>
      </div>
      <div class="pill-wrap">
        <div class="pill">Welcome offer</div>
      </div>
      <div class="copy">
        <div class="head">[[welcome_headline]]</div>
        <div class="sub">[[welcome_subtext]]</div>
      </div>
      <div class="cta-zone">
        <span class="cta">[[welcome_cta_text]]</span>
        <div class="terms">[[welcome_terms]]</div>
      </div>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
  <script>
  (function () {
    var RATIO = 1.5;
    function fit() {
      var shell = document.querySelector('.ad-shell');
      if (!shell) return;
      var w = shell.clientWidth || (shell.parentElement && shell.parentElement.clientWidth) || window.innerWidth || 320;
      if (w < 1) w = 320;
      shell.style.width = '100%';
      shell.style.height = (w * RATIO) + 'px';
      shell.style.fontSize = (w / 20) + 'px';
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
    else fit();
    window.addEventListener('resize', fit);
  })();
  </script>
</body>
</html>
