<!--
  GAM Creative Template — Interstitial Welcome Offer (320×480 inventory).
  Edge-to-edge fill; em sizing from shell width (avoids GAM preview vw blow-up).
  Legal footer is outside the click <a> (nested anchors break GAM preview).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  .ad-shell {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-size: 1vw;
  }
  .ad {
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    padding: 0 2.5% 5%;
    display: flex; flex-direction: column;
    overflow: hidden;
    text-decoration: none;
  }
  .ad-shell.legal-band .ad {
    flex: 1 1 0;
    min-height: 0;
    padding-bottom: 0.5%;
  }

  .ad .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    margin-top: 10px; margin-bottom: 0;
    flex: 0 0 auto;
  }
  /* Height-driven, not a forced square — see interstitial-standard.html for why. */
  .ad .logo {
    width: 62%;
    height: 9em;
    min-height: 26px;
    max-height: 64px;
    flex-shrink: 0;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center;
    border-radius: 2em;
  }
  .ad .pill-wrap {
    display: flex; justify-content: center; margin: 3em 0;
    flex: 0 0 auto;
  }
  .ad .pill {
    padding: 1em 2.5em; border-radius: 999px;
    background: #FFC107; color: #0A0A0A;
    font-size: 2.5em; font-weight: 800;
    letter-spacing: 0.08em; text-indent: 0.08em;
    text-transform: uppercase; text-align: center;
  }
  .ad .copy {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    justify-content: center; gap: 2em;
    text-align: center; min-height: 0;
    overflow: hidden;
  }
  .ad .copy .head {
    font-size: 6.2em; font-weight: 800;
    line-height: 0.98; letter-spacing: -0.03em;
  }
  .ad .copy .sub {
    font-size: 4em; opacity: 0.85;
    line-height: 1.25; font-weight: 500;
  }
  .ad .cta-zone {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
    min-height: 0;
  }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none;
    width: 95%;
    height: 12%;
    max-height: 64px;
    min-height: 44px;
    margin-top: 0;
    position: relative;
    border-radius: 1.2em;
    font-size: 4.8em;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px 0 rgba(0, 32, 27, 0.69);
    flex: 0 0 auto;
    box-sizing: border-box;
  }
  .ad .terms {
    margin-top: 2em;
    font-size: 2.5em; opacity: 0.55;
    text-align: center; line-height: 1.3;
  }

  .ad-shell .legal { pointer-events: none; z-index: 10; }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    flex: 0 0 auto;
    position: relative;
    margin: 0 1% 0.5%;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2.2em; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 0.35em; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.2em; height: 1.2em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.85em; font-weight: 800; line-height: 1;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ad-shell .legal.legal-band {
    flex: 0 0 auto;
    flex-shrink: 0;
    position: relative;
    width: 100%;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 0.4em;
    box-sizing: border-box;
    padding: 0.8em 0.8em;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 2.2em; font-weight: 600; line-height: 1.15;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4em; height: 1.4em; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 0.9em; font-weight: 800; line-height: 1;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal; overflow: hidden;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
      <div class="logo-wrap">
        <div class="logo" aria-label="[[bookmaker_name]]"></div>
      </div>
      <div class="pill-wrap">
        <div class="pill">Welcome offer</div>
      </div>
      <div class="copy">
        <div class="head">[[welcome_headline]]</div>
        <div class="sub">[[welcome_subtext]]</div>
      </div>
      <div class="cta-zone">
        <span class="cta">[[welcome_cta_text]]</span>
        <div class="terms">[[welcome_terms]]</div>
      </div>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
  <script>
  (function () {
    function apply() {
      var shell = document.querySelector('.ad-shell');
      if (!shell) return;
      var w = shell.clientWidth || document.documentElement.clientWidth || 320;
      var h = shell.clientHeight || document.documentElement.clientHeight || Math.round(w * 1.5);
      if (w < 1) w = 320;
      if (h < 1) h = Math.round(w * 1.5);
      var unit = Math.min(w, h / 1.5) * 0.01;
      var next = unit + 'px';
      if (shell.style.fontSize !== next) shell.style.fontSize = next;
      var cardGap = Math.round(h * 0.045) + 'px';
      var tightGap = Math.round(h * 0.034) + 'px';
      shell.style.setProperty('--dba-card-gap', cardGap);
      shell.style.setProperty('--dba-card-gap-tight', tightGap);
    }
    function boot() {
      apply();
      requestAnimationFrame(function () {
        apply();
        if (window.DbaApplyShellMetrics) window.DbaApplyShellMetrics();
      });
      window.addEventListener('resize', apply);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
