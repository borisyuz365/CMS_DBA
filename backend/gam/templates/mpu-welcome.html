<!--
  GAM Creative Template — MPU Welcome Offer (300×250).
  At export, branding / disclaimer placeholders are baked into this HTML.
  Remaining CreativeTemplate variable (avoid bracket-percent macros in comments — GAM scans them):
    - non-Bet365: cta_url
    - Bet365 (payload-link): OS_Type — CTA opens Bookie.Link

  Legal footer sits outside the click <a> (nested anchors break GAM preview).
  Brazil layout uses .ad-shell.legal-band instead of :has() (unsupported in GAM).

  Layout mirrors CMS AdPreview renderWelcomeMPU: logo + pill row, centered
  offer copy. CTA is absolutely pinned to the same bottom offsets as
  mpu-standard.html so welcome and match slides share one button placement.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .ad-shell {
    width: 300px; height: 250px;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
    color: [[brand_color_2_or_white]];
  }
  .ad {
    width: 100%; height: 100%;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    /* Bottom pad = CTA (30) + gap (4) + dots (10) + dotsBottom (6) = 50 — matches renderMPU. */
    padding: 10px 0 50px;
    text-decoration: none;
  }
  .ad-shell.legal-strip .ad {
    /* dotsBottom 18 + dots 10 + gap 4 + CTA 30 = 62 */
    padding-bottom: 62px;
  }
  .ad-shell.legal-band .ad {
    /* brazilBand (~25) + 4 + 10 + 4 + CTA 26 = 69 */
    padding: 8px 0 69px;
  }

  .ad .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 14px 8px;
    flex-shrink: 0;
  }
  .ad-shell.legal-band .ad .top-row {
    margin: 0 12px 4px;
  }

  .ad .logo {
    width: 42px; height: 42px;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center center;
    flex-shrink: 0;
  }
  .ad-shell.legal-band .ad .logo { width: 32px; height: 32px; }

  .ad .pill {
    padding: 3px 8px 1px;
    border-radius: 999px;
    background: [[welcome_pill_bg]]; color: [[welcome_pill_text_color]];
    font-size: 9px; font-weight: 800; line-height: 1;
    letter-spacing: 0.06em; text-indent: 0.06em;
    text-transform: uppercase; text-align: center;
    flex-shrink: 0;
  }
  .ad-shell.legal-band .ad .pill {
    padding: 2px 6px 1px;
    font-size: 8px;
  }

  .ad .copy {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 6px;
    text-align: center;
    min-height: 0;
    padding: 0 18px;
    box-sizing: border-box;
  }
  .ad-shell.legal-band .ad .copy {
    gap: 4px;
    padding: 0 16px;
  }

  .ad .copy .head {
    font-size: 22px; font-weight: 800;
    line-height: 1.05; letter-spacing: -0.02em;
  }
  .ad-shell.legal-band .ad .copy .head { font-size: 18px; }

  .ad .copy .sub {
    font-size: 11px; opacity: 0.8; line-height: 1.25;
  }
  .ad-shell.legal-band .ad .copy .sub { font-size: 10px; }

  .ad .copy .terms {
    font-size: 8px; opacity: 0.55; line-height: 1.2; margin-top: 2px;
  }
  .ad-shell.legal-band .ad .copy .terms { font-size: 7px; }

  /* Same absolute CTA geometry as mpu-standard.html */
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none; height: 30px;
    position: absolute; left: 14px; right: 14px; bottom: 26px;
    margin-top: 0; z-index: 2;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center;
  }
  .ad-shell.legal-strip .ad .cta { bottom: 32px; }
  .ad-shell.legal-band .ad .cta {
    left: 12px; right: 12px; bottom: 43px;
    height: 26px; font-size: 11px;
  }

  /* Legal footer — sibling of .ad inside .ad-shell (not nested in click link). */
  .ad-shell .legal {
    pointer-events: none;
    z-index: 10;
  }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    position: absolute; left: 6px; right: 6px; bottom: 2px;
    display: flex; align-items: center; gap: 6px;
    font-size: 5.5px; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 11px; height: 11px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 6px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: none;
    flex: 1 1 auto; min-width: 0; text-align: right; line-height: 1.15;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; text-overflow: ellipsis; white-space: normal;
    overflow-wrap: anywhere; word-break: normal;
  }
  .ad-shell .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 25px;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 5px;
    box-sizing: border-box;
    padding: 1px 6px;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 7px; font-weight: 700; line-height: 1.15;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 8px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="[[ad_href]]" [[ad_attrs]] target="_blank">
      <div class="top-row">
        <div class="logo" aria-label="[[bookmaker_name]]"></div>
        <div class="pill">[[welcome_pill_text]]</div>
      </div>
      <div class="copy">
        <div class="head">[[welcome_headline]]</div>
        <div class="sub">[[welcome_subtext]]</div>
        <div class="terms">[[welcome_terms]]</div>
      </div>
      <span class="cta">[[welcome_cta_text]]</span>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
</body>
</html>
