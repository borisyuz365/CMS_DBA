<!--
  GAM Creative Template — Banner Welcome Offer (320×50).
  Legal footer is outside the click <a> (nested anchors break GAM preview).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .ad-shell {
    width: 320px; height: 50px;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
  }
  .ad {
    width: 100%; height: 100%;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    padding: 4px 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    column-gap: 8px;
    text-decoration: none;
  }
  .ad-shell.legal-strip .ad {
    padding-bottom: 15px;
  }
  .ad-shell.legal-band .ad {
    padding: 0 6px 18px;
    column-gap: 5px;
  }
  .ad-shell.legal-band .ad .logo { width: 52px; height: 52px; }
  .ad-shell.legal-band .ad .cta { height: 16px; padding: 0 5px; font-size: 6.5px; }
  .ad-shell.legal-band .ad .copy .head { font-size: 8px; }
  .ad-shell.legal-band .ad .copy .sub { font-size: 5.5px; }

  .ad .logo {
    width: 48px; height: 48px;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center;
    flex-shrink: 0;
  }
  .ad .copy {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1px; min-width: 0;
    line-height: 1.1; text-align: center;
  }
  .ad .copy .head {
    font-size: 11px; font-weight: 800; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .ad .copy .sub {
    font-size: 7.5px; opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none; height: 24px; padding: 0 6px;
    position: relative;
    border-radius: 4px;
    font-size: 8px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 0.01em;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .ad-shell .legal { pointer-events: none; z-index: 10; }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    position: absolute; left: 4px; right: 4px; bottom: 0;
    display: flex; align-items: center; gap: 4px;
    font-size: 5px; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 10px; height: 10px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 5px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: none;
    flex: 1 1 auto; min-width: 0; text-align: right; line-height: 1.15;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; text-overflow: ellipsis; white-space: normal;
    overflow-wrap: anywhere; word-break: normal;
  }
  .ad-shell .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 12px;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 4px;
    box-sizing: border-box;
    padding: 1px 4px;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 4.5px; font-weight: 700; line-height: 1.15;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 9px; height: 9px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 4.4px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="[[ad_href]]" [[ad_attrs]] target="_blank">
      <div class="logo" aria-label="[[bookmaker_name]]"></div>
      <div class="copy">
        <div class="head">[[welcome_headline]]</div>
        <div class="sub">[[welcome_subtext]]</div>
      </div>
      <span class="cta">[[welcome_cta_text]]</span>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
</body>
</html>
