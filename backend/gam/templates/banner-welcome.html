<!--
  GAM Creative Template — Banner Welcome Offer (320×50).
  Variables use GAM's `[%variable_name%]` macro syntax.

  Horizontal 3-column layout: logo · welcome copy · CTA.
  No match feed — static welcome headline / subtext from variables.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .ad {
    width: 320px; height: 50px;
    background: [%brand_color_1%];
    color: [%brand_color_2_or_white%];
    border-radius: 8px;
    overflow: hidden;
    font-family: '365 Sans', Inter, sans-serif;
    box-sizing: border-box;
    padding: 4px 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    column-gap: 8px;
    position: relative;
    text-decoration: none;
  }
  .ad:has(.legal-band) {
    padding: 0 6px 18px;
    column-gap: 5px;
  }
  .ad:has(.legal-band) .logo { width: 52px; height: 52px; }
  .ad:has(.legal-band) .cta { height: 20px; padding: 0 6px; font-size: 8px; }
  .ad:has(.legal-band) .copy .head { font-size: 9px; }
  .ad:has(.legal-band) .copy .sub { font-size: 6px; }

  .ad .logo {
    width: 48px; height: 48px;
    background-image: url('[%bookmaker_logo_url%]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center;
    flex-shrink: 0;
  }
  .ad .copy {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1px; min-width: 0;
    line-height: 1.1; text-align: center;
  }
  .ad .copy .head {
    font-size: 13px; font-weight: 800; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .ad .copy .sub {
    font-size: 9px; opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .ad .cta {
    background: [%cta_bg_color%];
    color: [%cta_text_color%];
    border: none; height: 30px; padding: 0 8px;
    position: relative;
    border-radius: 4px;
    font-size: 10px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

  .ad .legal { pointer-events: none; }
  .ad .legal.legal-strip {
    position: absolute; left: 4px; right: 4px; bottom: 1px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 6px; opacity: 0.85;
  }
  .ad .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 2px; }
  .ad .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 10px; height: 10px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 5px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    pointer-events: auto;
    max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ad .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 12px;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 4px;
    box-sizing: border-box;
    padding: 1px 4px;
    background: rgba(0, 0, 0, 0.72);
    color: #FFFFFF;
    font-size: 4.5px; font-weight: 700; line-height: 1.15;
    text-align: left; z-index: 2;
  }
  .ad .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 8px; height: 8px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 4px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad .legal.legal-band .text {
    color: inherit; text-decoration: none;
    pointer-events: auto;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
    <div class="logo" aria-label="[%bookmaker_name%]"></div>
    <div class="copy">
      <div class="head">[%welcome_headline%]</div>
      <div class="sub">[%welcome_subtext%]</div>
    </div>
    <button class="cta" type="button">[%welcome_cta_text%]</button>
    <div class="legal [%disclaimer_layout%]">
      <span class="marks"><span class="age18">18+</span></span>
      <a class="text" href="[%disclaimer_url%]" target="_blank">[%disclaimer_text%]</a>
    </div>
  </a>
</body>
</html>
