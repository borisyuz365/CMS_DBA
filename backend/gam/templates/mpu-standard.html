<!--
  GAM Creative Template — MPU Standard (300×250).
  At export, branding / feed / disclaimer placeholders are baked into this
  HTML. The only remaining CreativeTemplate variable is cta_url (plus
  %%CLICK_URL_UNESC%% for the GAM click tracker).

  Legal footer sits outside the click <a> (nested anchors break GAM preview).
  Brazil layout uses .ad-shell.legal-band instead of :has() (unsupported in GAM).

  Layout: .ad-stack is pinned to axisY (110px) — match carousel centers there;
  logo hangs above via .logo-wrap + logoOffsetY so size/axis shifts do not move the logo.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="[[runtime_url]]" defer></script>
<style>
  html, body { margin: 0; padding: 0; }
  .ad-shell {
    width: 300px; height: 250px;
    position: relative;
    border-radius: [[ad_border_radius]];
    overflow: hidden;
    box-sizing: border-box;
    color: [[brand_color_2_or_white]];
  }
  .ad {
    width: 100%; height: 100%;
    background: [[ad_background]];
    color: [[brand_color_2_or_white]];
    font-family: [[ad_font_family]];
    box-sizing: border-box;
    position: relative;
    display: block;
    padding: 0;
    text-decoration: none;
  }
  /* Fixed vertical axis — sync with MPU_LAYOUT.axisY in frontend dbaUtils.js */
  .ad-stack {
    position: absolute;
    top: 110px;
    left: 14px;
    right: 14px;
    transform: translateY(-50%);
  }
  .ad-shell.legal-band .ad-stack { left: 12px; right: 12px; }
  .logo-wrap {
    position: absolute;
    bottom: 100%;
    left: 50%;
    /* logoOffsetY (11px) — axisY compensate + 3px nudge down; cards stay put */
    transform: translateX(-50%) translateY(11px);
    margin-bottom: 4px;
  }
  .ad .logo {
    width: 51px; height: 42px;
    margin: 0;
    background-image: url('[[bookmaker_logo_url]]');
    background-size: contain; background-repeat: no-repeat;
    background-position: center center;
  }
  .ad-shell.legal-band .ad .logo { width: 70px; height: 56px; }
  .ad-stack .matches {
    position: relative;
    margin: 0;
    padding-top: 8px;
    overflow-x: hidden;
    overflow-y: visible;
    box-sizing: border-box;
  }
  .ad-shell.legal-band .ad-stack .matches { padding-top: 7px; }
  /* Brazil: card→CTA gap is margin-bottom on .matches (4px), not bottom padding. */
  .ad-shell.legal-band .ad-stack .matches { margin-bottom: 4px; }
  .ad-shell.legal-band .ad .cta {
    position: absolute; left: 12px; right: 12px; bottom: 43px;
    height: 26px; margin-top: 0; font-size: 11px; flex-shrink: 0; z-index: 2;
  }
  /* Dots live on .ad-shell (outside the click <a>) — GAM strips/fails on
     JS-inserted block elements inside the anchor layer. */
  .ad-shell > .dba-dots-shell[data-layout="mpu"] {
    position: absolute; left: 0; right: 0; bottom: 12px;
    height: 10px; display: flex; justify-content: center; align-items: center;
    gap: 6px; z-index: 5; pointer-events: none;
  }
  .ad-shell > .dba-dots-shell[data-layout="mpu"] .dba-dot { height: 4px; width: 4px; }
  .ad-shell > .dba-dots-shell[data-layout="mpu"] .dba-dot-active { width: 9.6px; }
  .ad-shell.legal-band > .dba-dots-shell[data-layout="mpu"] { bottom: 29px; }
  .ad .cta {
    background: [[cta_bg_color]];
    color: [[cta_text_color]];
    border: none; height: 30px;
    position: absolute; left: 14px; right: 14px; bottom: 26px;
    margin-top: 0; z-index: 2;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center;
  }
  /* Legal footer — sibling of .ad inside .ad-shell (not nested in click link). */
  .ad-shell .legal {
    pointer-events: none;
    z-index: 10;
  }
  .ad-shell .legal.legal-hidden { display: none; }
  .ad-shell .legal.legal-strip {
    position: absolute; left: 6px; right: 6px; bottom: 2px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 7px; opacity: 0.85;
    color: [[legal_text_color]];
  }
  .ad-shell .legal.legal-strip .marks { display: inline-flex; align-items: center; gap: 3px; }
  .ad-shell .legal.legal-strip .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 7px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
    flex-shrink: 0;
  }
  .ad-shell .legal.legal-strip .text {
    color: inherit; text-decoration: underline;
    max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ad-shell .legal.legal-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 10%; min-height: 25px;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 5px;
    box-sizing: border-box;
    padding: 1px 6px;
    background: [[disclaimer_bg_color]];
    color: [[legal_text_color]];
    font-size: 7px; font-weight: 700; line-height: 1.15;
    text-align: left;
  }
  .ad-shell .legal.legal-band .marks { display: inline-flex; align-items: center; flex-shrink: 0; }
  .ad-shell .legal.legal-band .age18 {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    background: #0A0A0A; color: #FFFFFF;
    font-size: 8px; font-weight: 800; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.5px;
  }
  .ad-shell .legal.legal-band .text {
    color: inherit; text-decoration: none;
    white-space: normal;
    overflow: hidden;
    letter-spacing: 0.01em;
    flex: 1; min-width: 0;
  }
</style>
</head>
<body>
  <div class="ad-shell [[disclaimer_layout]]">
    <a class="ad" href="%%CLICK_URL_UNESC%%[%cta_url%]" target="_blank">
      <div class="ad-stack">
        <div class="logo-wrap">
          <div class="logo" aria-label="[[bookmaker_name]]"></div>
        </div>
        <div class="matches" data-feed="[[feed_url]]" data-per-slide="2" data-interval="3500" data-transition="700"></div>
      </div>
      <span class="cta">[[cta_text]]</span>
    </a>
    <div class="legal [[disclaimer_layout]]">
      <span class="marks"><span class="age18">18+</span></span>
      <span class="text">[[disclaimer_text]]</span>
    </div>
  </div>
</body>
</html>
